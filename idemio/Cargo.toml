[package]
name = "idemio"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Core framework for idemio products"
authors = [" Kalev Gonvick kalev.gonvick@idemio.dev"]

[profile.release]
strip = "symbols"
opt-level = 3

[dependencies]
async-trait = "0.1.89"
fnv = "1.0.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
dashmap = { version = "7.0.0-rc2", features = ["serde"] }
log = "0.4.29"
uuid = { version = "1.22.0", features = ["v4", "serde"] }
thiserror = "2.0.18"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "route_benchmarks"
harness = false